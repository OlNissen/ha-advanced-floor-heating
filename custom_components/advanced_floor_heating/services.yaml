set_room_temperature:
  name: Set Room Target Temperature
  description: Sets the target room temperature for the Advanced Floor Heating entity.
  target:
    entity:
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: The target room temperature to set.
      required: true
      example: 21.5
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider

set_floor_temperature:
  name: Set Floor Target Temperature
  description: Sets the target floor temperature for the Advanced Floor Heating entity.
  target:
    entity:
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: The target floor temperature to set.
      required: true
      example: 24.0
      selector:
        number:
          min: 15
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: slider
start_autotune:
  name: Start autotune
  description: >-
    Finder PID-værdier (Kp/Ki) ved at lade udgangen skifte mellem et højt og et lavt niveau
    og måle temperaturens svingning (relæ-metode). Gulvvarme er træg: en kørsel tager typisk
    mange timer. Resultatet vises i attributten autotune_result og anvendes først, når du
    trykker "Anvend Autotune" (eller kalder apply_autotune).
  target:
    entity:
      domain: climate
  fields:
    target:
      name: Regulér på
      description: Rum eller gulv. Tom = rum, hvis driftstilstanden bruger rummet, ellers gulv.
      required: false
      selector:
        select:
          options: [room, floor]
    output_step:
      name: Udgangstrin (%)
      description: Hvor langt udgangen svinger op og ned om bias-niveauet. Mindre = mindre udsving i temperatur.
      default: 30
      selector:
        number:
          min: 5
          max: 50
          step: 5
    noiseband:
      name: Støjbånd (°C)
      description: Hysterese omkring setpunktet. Skal være større end følerens støj.
      default: 0.2
      selector:
        number:
          min: 0.05
          max: 2
          step: 0.05
    rule:
      name: Tuning-regel
      description: ziegler-nichols (standard) eller tyreus-luyben (mere forsigtig).
      default: ziegler-nichols
      selector:
        select:
          options: [ziegler-nichols, tyreus-luyben]
    max_hours:
      name: Maks. varighed (timer)
      default: 24
      selector:
        number:
          min: 1
          max: 72
          step: 1

stop_autotune:
  name: Stop autotune
  description: Afbryder en kørende autotune. Regulatoren går tilbage til PID.
  target:
    entity:
      domain: climate

apply_autotune:
  name: Anvend autotune
  description: Gemmer de fundne Kp/Ki/Kd i rummets indstillinger (rummet genindlæses).
  target:
    entity:
      domain: climate

get_report:
  name: Get Report
  description: >
    Returnerer en kort rapport pr. rum (mål, temperaturer, PID, udsving og tid inden for målet de seneste 24 timer)
    til en AI-assistent. Markerer samtidig en gennemgang som udført.
  fields:
    mark_reviewed:
      name: Mark as reviewed
      description: Registrer at en gennemgang er udført (standard ja).
      default: true
      selector:
        boolean:

set_parameters:
  name: Set Parameters
  description: >
    Foreslå nye værdier for et rum (Kp/Ki/Kd, udekompensation, sol-fradrag, vægt). Værdierne tjekkes mod grænser og
    gemmes som forslag, som du anvender med knappen Anvend Forslag. Gulvgrænse og vinduesregel kan ikke ændres.
  fields:
    entity_id:
      name: Room
      description: Rummets climate-entity.
      required: true
      example: climate.kokken
      selector:
        entity:
          domain: climate
          integration: advanced_floor_heating
    kp:
      name: Kp
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
    ki:
      name: Ki
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
    kd:
      name: Kd
      selector:
        number:
          min: 0
          max: 200
          step: 0.1
    outdoor_ke:
      name: Outdoor compensation ke
      selector:
        number:
          min: 0
          max: 5
          step: 0.05
    solar_gain:
      name: Solar gain ks
      selector:
        number:
          min: 0
          max: 100
          step: 1
    link_weight:
      name: Link weight
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
    reason:
      name: Reason
      description: Kort begrundelse (vises i notifikationen).
      selector:
        text:
    apply:
      name: Apply directly
      description: Kun hvis Masteren tillader AI-ændringer; ellers bliver det et forslag.
      default: false
      selector:
        boolean:

discard_proposal:
  name: Discard Proposal
  description: Kasserer et afventende forslag for et rum.
  fields:
    entity_id:
      name: Room
      required: true
      selector:
        entity:
          domain: climate
          integration: advanced_floor_heating
